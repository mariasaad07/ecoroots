<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO Roots — Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">🌱 ECO Roots</a>
            <button class="nav-toggle" id="navToggle">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </div>
    </nav>

    <section class="section page-header">
        <div class="section-container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <span class="auth-icon">🔐</span>
                        <h2>Sign In</h2>
                        <p>Welcome back! Sign in to your account.</p>
                    </div>

                    <form id="signinForm" class="platform-form">
                        <div class="form-group">
                            <label>Email Address *</label>
                            <input type="email" id="signinEmail" placeholder="you@email.com" required>
                        </div>
                        <div class="form-group">
                            <label>Password *</label>
                            <input type="password" id="signinPass" placeholder="Enter your password" required>
                        </div>
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            Remember me
                        </label>
                        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
                    </form>

                    <div class="auth-footer">
                        <p>Don't have an account? <a href="register.html">Create Account</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-logo">🌱 ECO Roots</p>
            <p>Connecting people, volunteers, and nature for a greener future.</p>
            <p class="footer-copy">&copy; 2026 ECO Roots. All rights reserved.</p>
        </div>
    </footer>
    <script src="data.js"></script>
    <script src="auth.js"></script>
</body>
</html>
